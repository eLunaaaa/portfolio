name: Server integration

on:
  workflow_dispatch:
  workflow_call:

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

concurrency:
  group: server-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/backend/requirements.txt
      - name: Install integration dependencies
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y ffmpeg
          fi
          python -m pip install --timeout 15 --retries 1 -r server/backend/requirements.txt cryptography
      - name: Contracts, TLS and real FFmpeg merge
        timeout-minutes: 3
        run: python scripts/ci/check-server.py integration
